services:
  # Backend Web Service (FastAPI)
  - type: web
    name: nexus-ai-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-ai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_MOCK_MODE
        value: "false"

  # Frontend Static Site (React + Vite)
  - type: web
    name: nexus-ai-admin
    env: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Managed PostgreSQL Database
databases:
  - name: nexus-ai-db
    region: frankfurt
    plan: free
    databaseName: nexus_ai
    user: nexus_user
